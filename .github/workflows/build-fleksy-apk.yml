name: Compiler l'APK HeliBoard Fleksy

# Compile automatiquement à chaque modification de la branche principale,
# ou à la demande depuis l'onglet « Actions » de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      # Clé de signature fixe : chaque nouvelle APK s'installe par-dessus la précédente
      # (sans elle, il faudrait désinstaller à chaque mise à jour et on perdrait réglages et mots appris).
      # Par défaut on utilise la clé du dépôt ; un secret SIGNING_KEYSTORE_B64 la remplace s'il existe.
      - name: Installer la clé de signature
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            cp .github/signing/fleksy-debug.keystore ~/.android/debug.keystore
          fi

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PfleksyBuild=${{ github.run_number }}

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-Fleksy-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Rapports en cas d'échec
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: '*/build/reports'
        if: ${{ failure() }}
