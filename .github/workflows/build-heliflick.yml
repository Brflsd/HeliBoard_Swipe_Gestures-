name: Compiler et publier HeliFlick

# Compile l'APK signée à chaque modification de la branche principale (ou à la demande),
# puis la publie comme « Release » GitHub : lien direct pour les utilisateurs.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-heliflick
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # l'historique complet sert à numéroter les versions

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      # La clé de signature vient des secrets du dépôt : elle n'est jamais publiée.
      - name: Installer la clé de signature
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            # sans clé : on compile quand même pour vérifier le code, mais rien n'est publié
            echo "::warning::Secrets SIGNING_KEYSTORE_B64 et SIGNING_PASSWORD manquants : compilation de contrôle uniquement."
            echo "UNSIGNED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/heliflick.keystore"
          echo "HELIFLICK_KEYSTORE=$RUNNER_TEMP/heliflick.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$SIGNING_PASSWORD"
          echo "HELIFLICK_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Numéro de version
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PheliFlickBuild=$BUILD_NUMBER

      - name: Arrêt sans clé de signature
        if: env.UNSIGNED == 'true'
        run: |
          echo "::error::Code compilé avec succès, mais aucune APK publiée : ajoutez les secrets SIGNING_KEYSTORE_B64 et SIGNING_PASSWORD (Settings → Secrets and variables → Actions)."
          exit 1

      - name: Vérifier l'APK (signature, non déboguable)
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::Aucune APK trouvée"; ls -R app/build/outputs/apk || true; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256 digest)" | tr '\n' ' ') \
            || { echo "::error::APK non signée ou signature invalide ($APK)"; exit 1; }
          echo "::notice::Signature : $CERT"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          if echo "$BADGING" | grep -q "application-debuggable"; then echo "::error::L'APK est déboguable"; exit 1; fi
          echo "::notice::$(echo "$BADGING" | grep -E "^package:" | cut -c1-200)"
          cp "$APK" "HeliFlick-1.$BUILD_NUMBER.apk"
          rm -f "$RUNNER_TEMP/heliflick.keystore"

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.$BUILD_NUMBER" "HeliFlick-1.$BUILD_NUMBER.apk" \
            --title "HeliFlick 1.$BUILD_NUMBER" \
            --notes "Compilée automatiquement depuis le commit ${GITHUB_SHA::7}. Installez le fichier .apk ci-dessous sur votre téléphone." \
            --latest

      - name: Rapports en cas d'échec
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: '*/build/reports'
        if: ${{ failure() }}
